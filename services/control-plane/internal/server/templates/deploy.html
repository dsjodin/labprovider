{{ define "content" }}
<div id="foundationNote"></div>

<section class="panel">
  <h2>Services</h2>
  <div class="body" id="services"></div>
</section>

<section class="panel pad">
  <div class="actions">
    <button class="primary" onclick="start(false)">Deploy selected</button>
    <button class="danger" onclick="start(true)">Remove selected</button>
    <button onclick="selectAll()">Select all</button>
    <button id="cancel" onclick="cancelRun()" disabled>Cancel run</button>
    <span id="status"></span>
  </div>
</section>

<section class="panel">
  <h2>Run log</h2>
  <div class="body"><pre class="log" id="log" style="height:42vh"></pre></div>
</section>

<style>
  .panel + .panel, #foundationNote + .panel { margin-top: var(--size-5); }
  #foundationNote { font-size: 13px; margin-bottom: var(--size-4); color: var(--warn); }
  #foundationNote.ready { color: var(--ok); }
  label.svc { display: flex; gap: var(--size-3); align-items: center; padding: 7px 0;
    border-bottom: 1px solid var(--border); }
  label.svc:last-child { border-bottom: none; }
  label.svc input { width: auto; }
  label.svc .name { font-weight: 600; min-width: 118px; }
  label.svc .deps, label.svc .last { color: var(--fg-muted); font-size: 12px; }
  label.svc .last { margin-left: auto; }
  label.svc .last.failed { color: var(--bad); }
  label.svc.locked { opacity: 0.42; }
  label.svc input:disabled { cursor: not-allowed; }
  label.svc .tag { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    padding: 2px 8px; border-radius: var(--radius-round); background: var(--surface-3); color: var(--fg-dim); }
  label.svc .tag.core { background: var(--accent-bg); color: var(--accent); }
  label.svc .tag.ready { background: var(--ok-bg); color: var(--ok); }
  label.svc .tag.down { background: var(--bad-bg); color: var(--bad); }
  #status { font-size: 13px; }
  #status.bad { color: var(--bad); }
  #status.ok { color: var(--ok); }
</style>
{{ end }}

{{ define "scripts" }}
<script>
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');

async function loadServices() {
  const res = await fetch('/api/services');
  const services = await res.json() || [];

  const core = services.filter(s => s.core);
  const foundationReady = core.length > 0 && core.every(s => s.ready);
  const pending = core.filter(s => !s.ready).map(s => s.name);

  const note = document.getElementById('foundationNote');
  if (foundationReady) {
    note.className = 'ready';
    note.textContent = 'Foundation is up. All services are available to deploy.';
  } else {
    note.className = '';
    note.textContent = 'Deploy the foundation first: ' + core.map(s => s.name).join(' -> ') +
      '. Other services unlock once these are deployed and up (still to deploy: ' + pending.join(', ') + ').';
  }

  const box = document.getElementById('services');
  box.innerHTML = '';
  for (const s of services) {
    const locked = !s.core && !foundationReady;
    const label = document.createElement('label');
    label.className = 'svc' + (locked ? ' locked' : '');
    if (locked) label.title = 'Deploy the foundation services first.';
    const failed = (s.last_result || '').startsWith('failed');
    label.innerHTML = '<input type="checkbox" value=""> <span class="name"></span>' +
      '<span class="tag core" hidden>core</span><span class="tag ready" hidden>up</span>' +
      '<span class="tag down" hidden>down</span>' +
      '<span class="deps"></span><span class="last' + (failed ? ' failed' : '') + '"></span>';
    const cb = label.querySelector('input');
    cb.value = s.name;
    cb.disabled = locked;
    // Pre-select foundation services that are not yet up, so one Deploy click
    // stands up the base in dependency order.
    cb.checked = s.core && !s.ready;
    label.querySelector('.name').textContent = s.name;
    if (s.core) label.querySelector('.tag.core').hidden = false;
    if (s.ready) label.querySelector('.tag.ready').hidden = false;
    // Deployed at some point but nothing running now: the case state.json alone
    // could never tell apart from "up".
    if (!s.running && s.last_action === 'deploy' && !failed) {
      label.querySelector('.tag.down').hidden = false;
    }
    label.querySelector('.deps').textContent = (s.deps && s.deps.length) ? 'needs ' + s.deps.join(', ') : '';
    label.querySelector('.last').textContent = s.last_at ? s.last_action + ' ' + s.last_result + ' at ' + s.last_at : 'never deployed';
    box.appendChild(label);
  }
}

function selectAll() {
  document.querySelectorAll('#services input:not(:disabled)').forEach(cb => cb.checked = true);
}

function append(cls, text) {
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = text + '\n';
  logEl.appendChild(span);
  logEl.scrollTop = logEl.scrollHeight;
}

const cancelEl = document.getElementById('cancel');
let currentRun = null;

async function cancelRun() {
  if (currentRun === null) return;
  cancelEl.disabled = true;
  const res = await fetch('/api/deploys/' + currentRun + '/cancel', { method: 'POST' });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    append('fail', 'Cancel failed: ' + (data.error || res.statusText));
  }
}

async function start(remove) {
  const selected = [...document.querySelectorAll('#services input:checked')].map(cb => cb.value);
  if (!selected.length) { statusEl.className = 'bad'; statusEl.textContent = 'Select at least one service.'; return; }
  if (remove && !confirm('Remove ' + selected.join(', ') + '? Persistent data is preserved.')) return;
  logEl.textContent = '';
  statusEl.className = ''; statusEl.textContent = (remove ? 'Removing' : 'Deploying') + '...';
  const res = await fetch('/api/deploy', { method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ services: selected, remove }) });
  const data = await res.json();
  if (!res.ok) { statusEl.className = 'bad'; statusEl.textContent = data.error || 'Deploy rejected.'; return; }
  attach(data.id, remove);
}

// attach watches a run that is already going. A run started from a service page
// lands here as ?run=<id>, so there is one place that renders a deploy log
// rather than a second implementation on that page.
function attach(id, remove) {
  currentRun = id;
  statusEl.className = ''; statusEl.textContent = (remove ? 'Removing' : 'Deploying') + '...';
  cancelEl.disabled = false;
  let finished = false;
  const es = new EventSource('/api/deploys/' + id + '/events');
  const done = (cls, text) => {
    finished = true; currentRun = null; cancelEl.disabled = true;
    statusEl.className = cls; statusEl.textContent = text;
    es.close(); loadServices();
  };
  // The server drops a subscriber that falls behind rather than silently
  // losing lines; every (re)connection replays the run from the start, so
  // clear the pane to avoid rendering the replay twice.
  es.onopen = () => { logEl.textContent = ''; };
  es.onmessage = (m) => {
    const ev = JSON.parse(m.data);
    switch (ev.type) {
      case 'step-start': append('step', '==> ' + ev.service); break;
      case 'log': append('', '    ' + ev.line); break;
      case 'step-done': append('done', '    ' + ev.service + ' ok'); break;
      case 'step-failed': append('fail', '    ' + ev.service + ' FAILED: ' + ev.line); break;
      case 'deploy-done': append('done', 'Deploy finished.'); done('ok', 'Finished.'); break;
      case 'deploy-failed': append('fail', 'Deploy failed.'); done('bad', 'Failed - see log.'); break;
    }
  };
  es.onerror = () => {
    if (finished) { es.close(); return; }
    statusEl.className = ''; statusEl.textContent = 'Reconnecting to the deploy log...';
  };
}
loadServices();

const runParam = new URLSearchParams(location.search).get('run');
if (runParam) attach(Number(runParam), new URLSearchParams(location.search).get('remove') === '1');
</script>
{{ end }}
